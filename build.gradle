plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'checkstyle'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

// The demo corpus and its seed action (#41). Nothing in main depends on it, so the release jar and
// normal startup never include it.
sourceSets {
    demo {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.demo.output
        runtimeClasspath += sourceSets.demo.output
    }
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    String javaFxVersion = '25.0.4'

    // The macOS natives are arm64: 'mac' resolves the x86_64 build, which cannot load on Apple
    // Silicon. Only one macOS architecture can be shaded in, because both store their natives
    // under the same paths in the jar.
    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        ['win', 'mac-aarch64', 'linux'].each { platform ->
            implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
        }
    }

    implementation 'tools.jackson.core:jackson-databind:3.2.3'
    implementation 'tools.jackson.dataformat:jackson-dataformat-csv:3.2.3'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

application {
    mainClass = 'arbiter.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'arbiter.jar'

    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

run {
    standardInput = System.in
}

// The release: the jar and its run scripts in one folder, zipped (#42).
tasks.register('releaseZip', Zip) {
    description = 'Packages the release jar with its run scripts as build/distributions/arbiter.zip.'
    group = 'distribution'
    archiveFileName = 'arbiter.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('arbiter') {
        from(tasks.named('shadowJar'))
        from('scripts') {
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
    }
}

tasks.register('seedDemo', JavaExec) {
    description = 'Seeds a new demo workspace for the smoke checklist (docs/SmokeChecklist.md).'
    group = 'application'
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'arbiter.demo.DemoWorkspace'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    def folder = file(project.findProperty('demoWorkspace') ?: 'build/demo-workspace')
    args = [folder.absolutePath]
    doLast {
        println "Demo workspace created in ${folder}. Open it in Arbiter and sign in as described in docs/SmokeChecklist.md."
    }
}

checkstyle {
    toolVersion = '11.0.0'
}
