name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Setup repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build, test, and check style with Gradle
        run: ./gradlew check shadowJar

  # The build job above uses a JDK with JavaFX bundled in, so the JDK's own modules win over the
  # jar's and its natives are never exercised. This job runs the release the way a marker would, on
  # each platform: a plain JDK with nothing but the jar to supply JavaFX, started with java -jar.
  release:
    name: Release on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Setup repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25 without JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build the release jar
        shell: bash
        run: ./gradlew shadowJar

      - name: Check the bundled JavaFX natives are arm64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Runner is $(uname -m), not arm64; this check would pass vacuously"
            exit 1
          fi
          natives="$(mktemp -d)"
          unzip -q -j build/libs/arbiter.jar '*.dylib' -d "$natives" || true
          count=0
          for lib in "$natives"/*.dylib; do
            [ -e "$lib" ] || continue
            archs="$(lipo -archs "$lib")"
            echo "$(basename "$lib"): $archs"
            case " $archs " in
              *" arm64 "*) ;;
              *) echo "::error::$(basename "$lib") is $archs, not arm64"; exit 1 ;;
            esac
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No JavaFX natives found in the jar"
            exit 1
          fi
          echo "$count macOS natives, all arm64"

      # One step for every platform, so the check cannot drift between shells. Besides the app exiting,
      # it fails on a missing native, an uncaught exception, or anything DiagnosticLog records, whose
      # console lines start "SEVERE: Failed:" or "WARNING: Failed:".
      - name: Smoke-launch the release jar
        shell: pwsh
        working-directory: build/libs
        run: |
          # Linux runners have no display, so the app gets a virtual one.
          if ($IsLinux) {
              $command = 'xvfb-run'; $arguments = '-a', 'java', '-jar', 'arbiter.jar'
          } else {
              $command = 'java'; $arguments = '-jar', 'arbiter.jar'
          }
          $app = Start-Process -FilePath $command -ArgumentList $arguments -PassThru `
              -RedirectStandardOutput launch.out -RedirectStandardError launch.err
          Start-Sleep -Seconds 25
          $running = -not $app.HasExited
          if ($running) { $app.Kill($true) }
          $app.WaitForExit()
          $log = (Get-Content launch.out, launch.err -Raw -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $log
          if (-not $running) {
              Write-Output "::error::The app exited instead of staying open"
              exit 1
          }
          if ($log -match '(SEVERE|WARNING): Failed:|UnsatisfiedLinkError|incompatible architecture|Exception in') {
              Write-Output "::error::The app failed while starting"
              exit 1
          }
          Write-Output "The app stayed open with no startup failures"
