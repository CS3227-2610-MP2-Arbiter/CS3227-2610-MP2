name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Setup repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build, test, and check style with Gradle
        run: ./gradlew check shadowJar

  # The build job above uses a JDK with JavaFX bundled in, so the JDK's own modules win over the
  # jar's and its natives are never exercised. This job runs the release the way a marker would, on
  # each platform: a plain JDK with nothing but the jar to supply JavaFX, started by its run script.
  release:
    name: Release on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Setup repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25 without JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build and unpack the release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew releaseZip
          # A space in the path checks the scripts quote it.
          mkdir -p "$RUNNER_TEMP/release dir"
          unzip -q build/distributions/arbiter.zip -d "$RUNNER_TEMP/release dir"

      - name: Check the bundled JavaFX natives are arm64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Runner is $(uname -m), not arm64; this check would pass vacuously"
            exit 1
          fi
          natives="$(mktemp -d)"
          unzip -q -j build/libs/arbiter.jar '*.dylib' -d "$natives" || true
          count=0
          for lib in "$natives"/*.dylib; do
            [ -e "$lib" ] || continue
            archs="$(lipo -archs "$lib")"
            echo "$(basename "$lib"): $archs"
            case " $archs " in
              *" arm64 "*) ;;
              *) echo "::error::$(basename "$lib") is $archs, not arm64"; exit 1 ;;
            esac
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No JavaFX natives found in the jar"
            exit 1
          fi
          echo "$count macOS natives, all arm64"

      - name: Check the run script refuses an old Java
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          old="$(mktemp -d)"
          mkdir "$old/bin"
          printf '#!/bin/sh\necho "    java.specification.version = 21" >&2\n' > "$old/bin/java"
          chmod +x "$old/bin/java"
          if output="$(JAVA_HOME="$old" "$RUNNER_TEMP/release dir/arbiter/arbiter.sh" 2>&1)"; then
            echo "::error::The run script started with Java 21"
            exit 1
          fi
          echo "$output"
          case "$output" in
            *"needs Java 25 or later"*"Java 21"*) ;;
            *) echo "::error::The run script did not explain the Java version"; exit 1 ;;
          esac

      - name: Smoke-launch the release with its run script
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/release dir/arbiter"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./arbiter.sh > launch.log 2>&1 &
          else
            ./arbiter.sh > launch.log 2>&1 &
          fi
          app=$!
          sleep 25
          if ! kill -0 "$app" 2>/dev/null; then
            wait "$app" || true
            echo "::error::The app exited instead of staying open"
            cat launch.log
            exit 1
          fi
          pkill -f arbiter.jar || true
          kill "$app" 2>/dev/null || true
          if grep -qiE 'UnsatisfiedLinkError|incompatible architecture|Exception in' launch.log; then
            echo "::error::The app failed while starting"
            cat launch.log
            exit 1
          fi
          echo "The app stayed open with no startup failures"
          cat launch.log

      - name: Smoke-launch the release with its run script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\release dir\arbiter"
          $app = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'arbiter.bat' -PassThru `
              -RedirectStandardOutput launch.log -RedirectStandardError launch.err
          Start-Sleep -Seconds 25
          $running = -not $app.HasExited
          if ($running) { taskkill /T /F /PID $app.Id | Out-Null }
          $log = (Get-Content launch.log, launch.err -Raw -ErrorAction SilentlyContinue) -join "`n"
          if (-not $running) {
              Write-Output "::error::The app exited instead of staying open"
              Write-Output $log
              exit 1
          }
          if ($log -match 'UnsatisfiedLinkError|Exception in') {
              Write-Output "::error::The app failed while starting"
              Write-Output $log
              exit 1
          }
          Write-Output "The app stayed open with no startup failures"
          Write-Output $log
          exit 0
